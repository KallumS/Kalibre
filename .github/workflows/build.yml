# Builds Kalibre for Apple silicon Macs (a .dmg to download from the run's
# Artifacts) and for Windows (a .zip, decision 0129), and runs the tests on
# Linux, macOS and Windows. Pushing a tag that starts with "v" (v0.1.0) also
# publishes a GitHub Release with both attached.

name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libxi-dev \
            libgl1-mesa-dev xvfb
      - name: Core tests (no JUCE)
        run: |
          cmake -B build-core -G Ninja -DKALIBRE_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ./build-core/KalibreTests
      - name: The app, its tests and the renderer
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target Kalibre KalibreAppTests KalibreRender
      - name: App tests (engine, window)
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -extension MIT-SHM" ./build/KalibreAppTests_artefacts/Debug/KalibreAppTests
      - name: Render the window
        run: xvfb-run -a -s "-screen 0 1600x1000x24 -extension MIT-SHM" ./build/KalibreRender_artefacts/Debug/KalibreRender renders 1
      - uses: actions/upload-artifact@v4
        with:
          name: window-renders
          path: renders/*.png

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --target Kalibre KalibreTests KalibreAppTests
      - name: Core tests
        run: ./build/KalibreTests
      - name: App tests
        run: ./build/KalibreAppTests_artefacts/Release/KalibreAppTests
      - name: Package
        run: |
          APP="build/Kalibre_artefacts/Release/Kalibre.app"
          lipo -info "$APP/Contents/MacOS/Kalibre"
          mkdir -p "$APP/Contents/Resources/Scripts"
          cp Scripts/*.lua "$APP/Contents/Resources/Scripts/"
          # An ad-hoc signature: enough for an Apple silicon Mac to run it.
          # (No Developer ID yet, so the first launch needs right-click > Open.)
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          cp docs/INSTALL-MAC.txt "dmg/Read me first.txt"
          made=0
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Kalibre" -srcfolder dmg -ov -format UDZO Kalibre-macOS.dmg && { made=1; break; }
            echo "hdiutil failed (attempt $attempt), trying again"
            sleep 10
          done
          [ "$made" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: Kalibre-macOS
          path: Kalibre-macOS.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kalibre-macOS.dmg

  windows:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # Visual Studio's compiler in the shell, for Ninja; NASM for the JSFX engine's x64 code (ysfx).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        # -k 0: on past a file that fails, so one run shows every error.
        run: cmake --build build --target Kalibre KalibreTests KalibreAppTests -- -k 0
      - name: Core tests
        run: .\build\KalibreTests.exe
      - name: App tests
        run: .\build\KalibreAppTests_artefacts\Release\KalibreAppTests.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Kalibre\Scripts | Out-Null
          Copy-Item build\Kalibre_artefacts\Release\Kalibre.exe Kalibre\
          Copy-Item Scripts\*.lua Kalibre\Scripts\
          Copy-Item docs\INSTALL-WINDOWS.txt "Kalibre\Read me first.txt"
          Compress-Archive -Path Kalibre -DestinationPath Kalibre-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Kalibre-Windows
          path: Kalibre-Windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kalibre-Windows.zip
